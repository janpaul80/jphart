<!-- Custom AI Chatbot Widget -->
<div id="hartmannAiWidget" class="hartmann-widget">
    <!-- Toggle Button -->
    <button class="widget-toggle" id="widgetToggle" aria-label="Open Hartmann AI">
        <svg class="widget-icon-chat" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <svg class="widget-icon-close" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
    </button>
    
    <!-- Widget Window -->
    <div class="widget-window" id="widgetWindow">
        <!-- Header -->
        <div class="widget-header">
            <h3 class="widget-brand">Hartmann Ai</h3>
        </div>
        
        <!-- Main Content -->
        <div class="widget-content">
            <div class="widget-intro">
                <h2 class="widget-title">Your On-Demand<br>AI Engineer</h2>
                
                <div class="widget-help-box">
                    <div class="help-box-header">
                        <p class="help-box-title">How can we help?</p>
                        <div class="help-box-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                            </svg>
                        </div>
                    </div>
                    <p class="help-box-text">Our AI Agent responds directly <strong>24/7</strong></p>
                    <button class="widget-btn-primary" id="openChatBtn">Send us a message</button>
                </div>
            </div>
            
            <!-- Contact Options -->
            <div class="widget-contact">
                <p class="contact-header">CONNECT WITH US</p>
                <a href="https://wa.me/436706034585" target="_blank" rel="noopener noreferrer" class="contact-option">
                    <div class="contact-option-left">
                        <svg class="contact-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
                        </svg>
                        <span class="contact-label">WhatsApp</span>
                    </div>
                    <svg class="contact-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </a>
                <a href="mailto:hello@paulhartmann.dev" class="contact-option">
                    <div class="contact-option-left">
                        <svg class="contact-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                        <span class="contact-label">Email</span>
                    </div>
                    <svg class="contact-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </a>
            </div>
        </div>
        
        <!-- Chat Interface (Hidden by default) -->
        <div class="widget-chat" id="widgetChat" style="display: none;">
            <div class="chat-header">
                <button class="chat-back" id="chatBackBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>
                <h3 class="chat-title">Chat with AI</h3>
            </div>
            
            <div class="chat-messages" id="chatMessages">
                <div class="chat-message bot-message">
                    <div class="message-avatar">AI</div>
                    <div class="message-bubble">
                        <p>Hi! I'm your AI assistant. How can I help you today?</p>
                    </div>
                </div>
            </div>
            
            <div class="chat-input-wrapper">
                <form class="chat-form" id="chatForm">
                    <input 
                        type="text" 
                        class="chat-input" 
                        id="chatInput" 
                        placeholder="Type your message..."
                        autocomplete="off"
                        required
                    >
                    <button type="submit" class="chat-send" aria-label="Send">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </form>
                <div class="chat-typing" id="chatTyping" style="display: none;">
                    <span></span><span></span><span></span>
                </div>
            </div>
        </div>
    </div>
</div>
